<div class="flex justify-center items-center min-h-screen bg-zinc-100">
  <form (ngSubmit)="onSubmit()" class="bg-surface p-8 rounded-default shadow-[0_2px_10px_rgba(0,0,0,0.1)] w-full max-w-[360px] flex flex-col gap-4">
    <h2 class="text-heading text-text text-center m-0">Painel Emissor</h2>
    <p class="text-center text-text-muted text-body-sm m-0">Mock PJe/SEI — Acesso restrito</p>

    <label class="flex flex-col gap-1 text-label text-text-secondary">
      Usuário
      <input
        type="text"
        [ngModel]="usuario()"
        (ngModelChange)="usuario.set($event); erro.set(false)"
        name="usuario"
        class="px-3 py-2 border border-border rounded-sm text-body focus:outline-none focus:border-primary focus:shadow-[0_0_0_3px_rgba(37,99,235,0.15)] transition-colors"
      />
    </label>

    <label class="flex flex-col gap-1 text-label text-text-secondary">
      Senha
      <input
        type="password"
        [ngModel]="senha()"
        (ngModelChange)="senha.set($event); erro.set(false)"
        name="senha"
        class="px-3 py-2 border border-border rounded-sm text-body focus:outline-none focus:border-primary focus:shadow-[0_0_0_3px_rgba(37,99,235,0.15)] transition-colors"
      />
    </label>

    @if (erro()) {
      <p class="text-danger text-caption text-center m-0">Credenciais inválidas.</p>
    }

    <button
      type="submit"
      [disabled]="enviando()"
      class="py-2.5 bg-primary text-text-inverse border-none rounded-sm text-body cursor-pointer hover:bg-primary-hover transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
    >{{ enviando() ? 'Entrando...' : 'Entrar' }}</button>
  </form>
</div>
